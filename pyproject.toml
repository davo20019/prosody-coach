[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prosody-coach"
version = "0.3.0"
description = "CLI tool to improve English prosody for non-native speakers"
requires-python = ">=3.10"
dependencies = [
    "praat-parselmouth>=0.4.3",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "google-genai>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "gTTS>=2.3.0",
    "webrtcvad>=2.0.10",
    "bournemouth-forced-aligner>=1.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
prosody = "main:app"

[tool.setuptools]
py-modules = ["main", "analyzer", "coach", "coach_pipeline", "config", "feedback", "frameworks", "framework_scoring", "local_coach", "prompts", "recorder", "storage", "realtime"]

[tool.setuptools.packages.find]
include = ["web*"]

[tool.setuptools.package-data]
web = ["templates/**/*.html", "static/**/*", "static/vendor/*"]
